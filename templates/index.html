{% extends "base.html" %}

{% block content %}
<section class="pt-12 text-center">
  <h1 class="text-4xl font-bold tracking-tight">
    Rep<span class="text-indigo-600 dark:text-indigo-400">Wise</span>
  </h1>
  <p class="mt-3 text-lg text-stone-600 dark:text-stone-400">
    A training plan built from your goals, and the logbook that keeps it honest.
  </p>

  <div class="mt-10 space-y-3">
    <a href="{{ url_for('signup') }}"
       class="inline-flex h-12 w-full items-center justify-center rounded-xl bg-indigo-600 px-4 text-base font-semibold text-white shadow-sm transition hover:bg-indigo-700 active:scale-[0.98]">
      Get started
    </a>
    <a href="{{ url_for('login') }}"
       class="inline-flex h-12 w-full items-center justify-center rounded-xl border border-stone-300 bg-white px-4 text-base font-semibold text-stone-800 transition hover:bg-stone-100 active:scale-[0.98] dark:border-stone-700 dark:bg-stone-900 dark:text-stone-200 dark:hover:bg-stone-800">
      Sign in
    </a>
  </div>
</section>
{% endblock %}
