<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RepWise" />
  <title>{% block title %}RepWise{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  <script src="https://unpkg.com/htmx.org@1.9.12"
          integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"
          crossorigin="anonymous"></script>
  <script>
    // Listening on `document` (not body) because this runs in <head>
    // before <body> exists.
    document.addEventListener('htmx:configRequest', (event) => {
      const meta = document.querySelector('meta[name="csrf-token"]');
      if (meta) event.detail.headers['X-CSRFToken'] = meta.content;
    });
  </script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 antialiased dark:bg-stone-950 dark:text-stone-100">
  <main class="mx-auto max-w-md px-4 pb-28 pt-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
